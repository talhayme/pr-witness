# Dogfood: pr-witness witnesses its own pull requests.
name: pr-witness
on: pull_request

permissions:
  contents: read
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - uses: ./
        with:
          test-command: pytest
          mode: report
