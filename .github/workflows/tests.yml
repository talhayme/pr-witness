name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --prefix .tsrunner --no-audit --no-fund
      # The corpus is the regression gate: the numbers in eval/ must not
      # get worse without someone noticing.
      - run: python corpus/verify.py
      - run: python corpus/verify_ts.py
      - run: python eval/run_witness.py
