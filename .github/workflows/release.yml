# Publishes to PyPI on a version tag, with Trusted Publishing: no token is
# stored anywhere. PyPI trusts this repository's workflow identity instead.
#
# One-time setup on pypi.org (account → Publishing → "Add a new pending
# publisher"): owner talhayme, repository pr-witness, workflow release.yml,
# environment pypi. The project name is claimed by the first publish.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing
      attestations: write   # PEP 740 attestations on the uploaded files
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
