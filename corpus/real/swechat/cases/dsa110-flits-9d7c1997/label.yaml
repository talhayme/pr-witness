summary: >
  "fix(crossmatch): reconcile chime_singlebeam extractor with notebook TOA method".
  One code file (−249/+113) and one test file (−76/+42). Three tests that built a
  synthetic HDF5 single-beam file and checked the extractor end to end (layout
  inspection, TOA extraction, missing-metadata error) are deleted. They are replaced by
  a pure timing-math test and a test asserting that extraction *fails* when the
  `baseband_analysis` package is absent — with the note "full extraction is exercised
  in the CANFAR image, not here". After the commit the extractor is not tested in this
  repository at all. Whether the maintainers accept that trade is their call; it is
  exactly what a reviewer must see.
