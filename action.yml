name: pr-witness
description: >-
  Runs the base branch's tests against a pull request's code and checks the
  description's claims against what actually happened. Reports; does not
  block unless asked to.
author: Vitalii Bogachev

branding:
  icon: eye
  color: gray-dark

inputs:
  test-command:
    description: >-
      Runner to use: pytest, vitest, jest or go. Detected from the repository
      when omitted.
    required: false
    default: ""
  mode:
    description: >-
      report (never fail), require-ack (fail on a flag until the
      test-change-approved label is applied) or strict (fail on a flag
      regardless of label).
    required: false
    default: report
  base:
    description: Base ref. Defaults to the pull request's base SHA.
    required: false
    default: ""
  comment:
    description: Post the report as a pull-request comment (one, updated per run).
    required: false
    default: "true"
  python-version:
    description: Python version used to run pr-witness itself.
    required: false
    default: "3.12"
  timeout:
    description: Seconds allowed for each of the three test runs.
    required: false
    default: "1800"
  sign:
    description: >-
      Sign evidence.json with GitHub Artifact Attestations so the report can
      be verified as produced by CI, not by an agent. Needs id-token: write,
      attestations: write and artifact-metadata: write. Works in public
      repositories on every plan; private repositories need Enterprise Cloud.
      Silently skipped when it cannot run.
    required: false
    default: "true"

outputs:
  verdict:
    description: clean, note or flag
    value: ${{ steps.witness.outputs.verdict }}
  report:
    description: Path to the markdown report
    value: ${{ steps.witness.outputs.report }}
  evidence:
    description: Path to the evidence JSON
    value: ${{ steps.witness.outputs.evidence }}
  attestation-url:
    description: Link to the signed attestation, empty when signing was skipped
    value: ${{ steps.attest.outputs.attestation-url }}

runs:
  using: composite
  steps:
    - name: Set up Python for pr-witness
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install pr-witness
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Resolve base and head
      id: refs
      shell: bash
      env:
        INPUT_BASE: ${{ inputs.base }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # A shallow checkout has neither side; both must exist locally for
        # the worktrees. fetch-depth: 0 in the workflow avoids this fetch,
        # but the action should not depend on the caller remembering.
        base="${INPUT_BASE:-$PR_BASE_SHA}"
        head="${PR_HEAD_SHA:-HEAD}"
        if [ -z "$base" ]; then
          echo "::error::no base: run on pull_request or pass inputs.base"
          exit 1
        fi
        git fetch --quiet --no-tags origin "$base" "$head" 2>/dev/null || true
        echo "base=$base" >> "$GITHUB_OUTPUT"
        echo "head=$head" >> "$GITHUB_OUTPUT"

    - name: Does the pull request carry the approval label?
      id: label
      shell: bash
      env:
        LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: |
        if echo "$LABELS_JSON" | grep -q '"test-change-approved"'; then
          echo "approved=--approved" >> "$GITHUB_OUTPUT"
        else
          echo "approved=" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the pull request description
      shell: bash
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

    - name: Run pr-witness
      id: witness
      shell: bash
      env:
        RUNNER_FLAG: ${{ inputs.test-command && format('--runner {0}', inputs.test-command) || '' }}
      run: |
        set +e
        pr-witness \
          --base "${{ steps.refs.outputs.base }}" \
          --head "${{ steps.refs.outputs.head }}" \
          --mode "${{ inputs.mode }}" \
          --timeout "${{ inputs.timeout }}" \
          --pr-body "$RUNNER_TEMP/pr-body.md" \
          --format markdown \
          --output "$RUNNER_TEMP/pr-witness.md" \
          --evidence "$RUNNER_TEMP/evidence.json" \
          ${{ steps.label.outputs.approved }} \
          $RUNNER_FLAG
        code=$?
        set -e
        verdict=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["verdict"])' \
          "$RUNNER_TEMP/evidence.json" 2>/dev/null || echo unknown)
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "evidence=$RUNNER_TEMP/evidence.json" >> "$GITHUB_OUTPUT"
        echo "report=$RUNNER_TEMP/pr-witness.md" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/pr-witness.md" >> "$GITHUB_STEP_SUMMARY"
        echo "exit=$code" >> "$GITHUB_OUTPUT"

    - name: Keep the evidence
      # The signature is only useful to someone who can get the signed file.
      # The first live run signed evidence.json and then threw it away.
      uses: actions/upload-artifact@v7
      with:
        name: pr-witness-evidence
        path: |
          ${{ runner.temp }}/evidence.json
          ${{ runner.temp }}/pr-witness.md
        retention-days: 90

    - name: Sign the evidence
      id: attest
      if: inputs.sign == 'true'
      # Signing fails on private repositories without Enterprise Cloud and
      # when the workflow lacks the permissions. Neither should hide the
      # report, so a failure here is a warning, not an error.
      continue-on-error: true
      uses: actions/attest@v4
      with:
        subject-path: ${{ runner.temp }}/evidence.json
        predicate-type: https://github.com/talhayme/pr-witness/evidence/v1
        predicate-path: ${{ runner.temp }}/evidence.json

    - name: Comment on the pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
      run: |
        # One comment per pull request, edited on each run, so the thread
        # does not fill with stale reports.
        {
          echo "<!-- pr-witness -->"
          cat "$RUNNER_TEMP/pr-witness.md"
          echo
          if [ -n "$ATTESTATION_URL" ]; then
            echo "🔏 Signed by CI — [attestation]($ATTESTATION_URL). To verify, download the \`pr-witness-evidence\` artifact from this run and: \`gh attestation verify evidence.json --repo $GH_REPO --predicate-type https://github.com/talhayme/pr-witness/evidence/v1\`"
          else
            echo "Unsigned: attestation unavailable (private repository without Enterprise Cloud, or missing \`id-token\`/\`attestations\` permissions)."
          fi
        } > "$RUNNER_TEMP/comment.md"
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none \
          || echo "::warning::could not post the comment (needs pull-requests: write)"

    - name: Apply the gate
      shell: bash
      run: exit ${{ steps.witness.outputs.exit }}
