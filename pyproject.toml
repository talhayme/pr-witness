[project]
name = "pr-witness"
version = "0.3.2"
description = "Check whether a pull request's tests still mean what they meant before it"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vitalii Bogachev" }]
keywords = ["testing", "ci", "github-actions", "ai-agents", "code-review", "pytest", "vitest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
license = { text = "Apache-2.0" }
# checkwash does the diff-level half of this job, and does it well. It is a
# dependency rather than a reimplementation.
#
# No upper bound: pr-witness reads checkwash's JSON document each run and
# stores nothing from it (no fingerprints), so the fingerprint-stability
# reason for pinning below the next minor does not apply here. The one thing
# it depends on is the findings schema, which it checks at run time —
# run_checkwash refuses any output whose checkwash_findings_version is not the
# one it reads (CHECKWASH_FINDINGS_VERSION). checkwash#364: 0.8.0 reads
# identically to 0.7.0, so <0.8 only shut it out for no reason.
dependencies = ["checkwash>=0.8"]   # pin stays in CI; a schema bump is caught at run time (docs/upstream/README.md, checkwash#364)

[project.urls]
Homepage = "https://github.com/talhayme/pr-witness"
Repository = "https://github.com/talhayme/pr-witness"
Issues = "https://github.com/talhayme/pr-witness/issues"

[project.optional-dependencies]
dev = ["pytest", "jsonschema", "pyyaml"]

[project.scripts]
pr-witness = "pr_witness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The corpus under corpus/cases/ is made of test files on purpose — they are
# the fixtures this tool is measured on, not this project's tests. Narrowing
# testpaths is exactly what pr-witness flags in a pull request; here it is
# the honest reason for doing so, and the eval scripts run those files
# themselves.
testpaths = ["tests"]
